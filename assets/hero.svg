<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="CareerForge AI, Resume Analyzer and Enhancer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04080F"/>
      <stop offset="0.55" stop-color="#06122A"/>
      <stop offset="1" stop-color="#0B1F44"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.14" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <style>
    @keyframes blink { 50% { opacity: 0; } }
    .cur { animation: blink 1s steps(1) infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <ellipse cx="300" cy="175" rx="380" ry="120" fill="#3B82F6" opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.16;0.05" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- floating particles -->
    <circle cx="130" cy="360" r="1.6" fill="#22D3EE"><animate attributeName="cy" from="370" to="-10" dur="9s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="360" r="1.2" fill="#67E8F9"><animate attributeName="cy" from="370" to="-10" dur="11s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="360" r="2" fill="#34D399"><animate attributeName="cy" from="370" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="360" r="1.4" fill="#22D3EE"><animate attributeName="cy" from="370" to="-10" dur="12s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="360" r="1.8" fill="#67E8F9"><animate attributeName="cy" from="370" to="-10" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="360" r="1.2" fill="#3B82F6"><animate attributeName="cy" from="370" to="-10" dur="9s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="360" r="1.6" fill="#22D3EE"><animate attributeName="cy" from="370" to="-10" dur="10s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="360" r="2" fill="#34D399"><animate attributeName="cy" from="370" to="-10" dur="13s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="360" r="1.3" fill="#3B82F6"><animate attributeName="cy" from="370" to="-10" dur="14s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="14s" begin="-5s" repeatCount="indefinite"/></circle>

    <!-- scanning beam -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scanBand)">
      <animate attributeName="y" from="-60" to="300" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1200" height="1.5" fill="url(#scanLine)">
      <animate attributeName="y" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD on the right -->
    <g transform="translate(990 180)">
      <circle r="190" fill="url(#orb)">
        <animate attributeName="r" values="175;195;175" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="135" fill="none" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 11">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle r="105" fill="none" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="70 30 10 30">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle r="74" fill="none" stroke="url(#cy)" stroke-width="4" stroke-linecap="round" stroke-dasharray="130 335">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle cx="135" cy="0" r="5" fill="#67E8F9" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="-105" cy="0" r="4" fill="#34D399" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </g>
      <circle r="42" fill="#06122A" stroke="url(#cy)" stroke-width="2"/>
      <text y="11" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="url(#cy)">CF</text>
    </g>

    <!-- text -->
    <text x="70" y="52" font-family="Consolas,'Courier New',monospace" font-size="13" letter-spacing="4" fill="#3B82F6">RESUME ANALYZER // ENHANCER</text>
    <text x="1130" y="52" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#34D399">
      <tspan>&#9679;</tspan> READY TO ANALYZE
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="108" font-family="Consolas,'Courier New',monospace" font-size="15" letter-spacing="5" fill="#22D3EE">AI-POWERED CAREER TOOLKIT
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="66" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="1" fill="url(#cy)" filter="url(#glow)">CareerForge AI</text>

    <!-- rotating typewriter -->
    <text x="70" y="252" font-family="Consolas,'Courier New',monospace" font-size="28" fill="#22D3EE">&gt;</text>

    <clipPath id="r1"><rect x="100" y="222" width="0" height="40"><animate attributeName="width" values="0;378;378;0;0" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <text x="100" y="252" font-family="Consolas,'Courier New',monospace" font-size="28" fill="#E0F2FE" clip-path="url(#r1)">Parse. Score. Improve.</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.30;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <rect class="cur" x="100" y="224" width="3" height="32" fill="#67E8F9"><animate attributeName="x" values="100;478;478;100;100" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
    </g>

    <clipPath id="r2"><rect x="100" y="222" width="0" height="40"><animate attributeName="width" values="0;464;464;0;0" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
    <text x="100" y="252" font-family="Consolas,'Courier New',monospace" font-size="28" fill="#E0F2FE" clip-path="url(#r2)">Beat the ATS with real data</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.30;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/>
      <rect class="cur" x="100" y="224" width="3" height="32" fill="#67E8F9"><animate attributeName="x" values="100;564;564;100;100" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect>
    </g>

    <clipPath id="r3"><rect x="100" y="222" width="0" height="40"><animate attributeName="width" values="0;533;533;0;0" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
    <text x="100" y="252" font-family="Consolas,'Courier New',monospace" font-size="28" fill="#E0F2FE" clip-path="url(#r3)">Practice with an AI interviewer</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.30;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/>
      <rect class="cur" x="100" y="224" width="3" height="32" fill="#67E8F9"><animate attributeName="x" values="100;633;633;100;100" keyTimes="0;0.11;0.30;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect>
    </g>

    <text x="70" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#7C9CC4">React &#8226; Django &#8226; Supabase &#8226; ATS Scoring &#8226; Mock Interviews &#8226; Job Tracker</text>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round">
    <path d="M16 46V16H46"/>
    <path d="M1154 16H1184V46"/>
    <path d="M16 314V344H46"/>
    <path d="M1154 344H1184V314"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="none" stroke="url(#cy)" stroke-width="2"/>
</svg>
